<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baywheels Station Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #58a6ff;
      letter-spacing: 0.5px;
    }

    #progress {
      font-size: 13px;
      color: #8b949e;
    }

    #progress span {
      color: #3fb950;
      font-weight: 600;
    }

    #filter-btns {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid #30363d;
      background: transparent;
      color: #8b949e;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn.active {
      background: #21262d;
      color: #e6edf3;
      border-color: #58a6ff;
    }

    #map {
      flex: 1;
    }

    .popup-content {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-width: 180px;
    }

    .popup-content h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #1f2328;
    }

    .popup-content .meta {
      font-size: 12px;
      color: #57606a;
      margin-bottom: 8px;
    }

    .popup-content .visited-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .popup-content .visited-badge.yes {
      background: #dafbe1;
      color: #1a7f37;
    }

    .popup-content .visited-badge.no {
      background: #f6f8fa;
      color: #57606a;
    }

    .popup-content .station-id {
      font-size: 10px;
      color: #8c959f;
      margin-top: 6px;
      font-family: monospace;
      word-break: break-all;
    }
  </style>
</head>
<body>

<header>
  <h1>🚲 Baywheels SF</h1>
  <div id="progress">Loading...</div>
  <div id="filter-btns">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="visited">Visited</button>
    <button class="filter-btn" data-filter="unvisited">Unvisited</button>
  </div>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([37.772, -122.430], 13);

  // Esri satellite — free, no API key
  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { attribution: 'Tiles &copy; Esri', maxZoom: 19 }
  ).addTo(map);

  // Street name overlay so you can read the map
  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    { attribution: '', maxZoom: 19, opacity: 0.8 }
  ).addTo(map);

  function makeIcon(visited) {
    return L.divIcon({
      className: '',
      html: `<div style="
        width: 14px; height: 14px;
        border-radius: 50%;
        background: ${visited ? '#3fb950' : '#8b949e'};
        border: 2px solid ${visited ? '#fff' : '#444'};
        box-shadow: 0 0 ${visited ? '6px rgba(63,185,80,0.7)' : '3px rgba(0,0,0,0.5)'};
      "></div>`,
      iconSize: [14, 14],
      iconAnchor: [7, 7],
    });
  }

  let allMarkers = [];
  let currentFilter = 'all';

  async function init() {
    const [stationsRes, visitedRes] = await Promise.all([
      fetch('stations.json'),
      fetch('visited.json'),
    ]);
    const stations = await stationsRes.json();
    const { visited } = await visitedRes.json();
    const visitedSet = new Set(visited);

    const visitedCount = stations.filter(s => visitedSet.has(s.id)).length;
    document.getElementById('progress').innerHTML =
      `<span>${visitedCount}</span> / ${stations.length} stations visited`;

    stations.forEach(s => {
      const isVisited = visitedSet.has(s.id);
      const marker = L.marker([s.lat, s.lon], { icon: makeIcon(isVisited) });

      marker.bindPopup(`
        <div class="popup-content">
          <h3>${s.name}</h3>
          <div class="meta">Capacity: ${s.capacity} docks</div>
          <span class="visited-badge ${isVisited ? 'yes' : 'no'}">
            ${isVisited ? '✓ Visited' : 'Not visited'}
          </span>
          <div class="station-id">${s.id}</div>
        </div>
      `);

      marker._visitedState = isVisited;
      marker.addTo(map);
      allMarkers.push(marker);
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        allMarkers.forEach(m => {
          const show =
            currentFilter === 'all' ||
            (currentFilter === 'visited' && m._visitedState) ||
            (currentFilter === 'unvisited' && !m._visitedState);
          if (show) m.addTo(map); else map.removeLayer(m);
        });
      });
    });
  }

  init();
</script>
</body>
</html>
